<div class="space-y-6">
  <div class="flex items-center space-x-3 mb-6">
    <div class="p-3 bg-indigo-600/10 text-indigo-400 rounded-xl text-2xl animate-pulse">🔄</div>
    <div>
      <h2 class="text-2xl font-bold text-slate-100">Nuovo Prestito</h2>
      <p class="text-slate-400 text-sm">Associa un libro a un lettore registrato</p>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-12 gap-6 items-center">
    
    <div class="sm:col-span-4 flex justify-center">
      <div class="w-28 h-40 rounded-2xl border-2 border-dashed border-slate-700 bg-slate-950 flex flex-col items-center justify-center text-center p-2 relative overflow-hidden transition-all duration-300 shadow-lg">
        <img *ngIf="libroSelezionatoCompleto" [src]="libroSelezionatoCompleto.copertina" class="w-full h-full object-cover absolute inset-0 rounded-2xl animate-fade-in transition-opacity duration-300" alt="Copertina" />
        <div *ngIf="!libroSelezionatoCompleto" class="text-slate-600 space-y-1">
          <span class="text-2xl block">📖</span>
          <span class="text-[10px] font-semibold uppercase tracking-wider">Nessuna<br>Selezione</span>
        </div>
      </div>
    </div>

    <div class="sm:col-span-8 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">Seleziona Libro</label>
        <select [(ngModel)]="idLibroSelezionato" class="w-full p-3.5 text-slate-100 bg-slate-900 rounded-2xl border border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium text-sm">
          <option [value]="undefined" disabled selected class="text-slate-500">Scegli un volume...</option>
          <option *ngFor="let libro of libri" [value]="libro.id" [disabled]="!libro.is_disponibile">
            {{ libro.titolo }} {{ libro.is_disponibile ? '✓' : '✖ (In Prestito)' }}
          </option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-1.5">Seleziona Utente</label>
        <select [(ngModel)]="idUtenteSelezionato" class="w-full p-3.5 text-slate-100 bg-slate-900 rounded-2xl border border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-medium text-sm">
          <option [value]="undefined" disabled selected class="text-slate-500">Scegli un utente...</option>
          <option *ngFor="let utente of utenti" [value]="utente.id">{{ utente.nome }}</option>
        </select>
      </div>
    </div>
  </div>

  <button 
    (click)="registraPrestito()"
    [disabled]="!idLibroSelezionato || !idUtenteSelezionato"
    class="w-full mt-4 py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-700/20 hover:bg-indigo-700 disabled:bg-slate-800 disabled:text-slate-500 transition-all duration-200 transform hover:scale-[1.01] active:scale-95 flex items-center justify-center">
    <span>Conferma Prestito</span>
  </button>

  <h3 class="text-sm font-bold text-slate-200 mt-6 mb-3">Prestiti Attivi</h3>
  <div class="overflow-hidden rounded-xl border border-slate-800 bg-slate-900/50">
    <table class="w-full text-left text-sm">
      <thead>
        <tr class="bg-slate-800 text-slate-300">
          <th class="p-3">Libro</th>
          <th class="p-3">Utente</th>
          <th class="p-3 text-center">Azione</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of prestitiAttivi" class="border-b border-slate-800 text-slate-300 hover:bg-slate-800/40">
          <td class="p-3 font-medium">{{ p.titoloLibro }}</td>
          <td class="p-3 text-slate-400">{{ p.nomeUtente }}</td>
          <td class="p-3 text-center">
            <button (click)="restituisci(p.id_libro)" class="px-3 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg hover:bg-red-600 hover:text-white transition-all text-xs active:scale-90">
              Rientro
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
