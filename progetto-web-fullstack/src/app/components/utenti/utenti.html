<div class="space-y-6">
  <div class="flex items-center space-x-3 mb-6">
    <div class="p-3 bg-blue-600/10 text-blue-400 rounded-xl text-2xl">👤</div>
    <div>
      <h2 class="text-2xl font-bold text-slate-100">Nuovo Utente</h2>
      <p class="text-slate-400 text-sm">Registra un nuovo membro della biblioteca</p>
    </div>
  </div>

  <form (ngSubmit)="salvaUtente()" #userForm="ngForm" class="space-y-5">
    <div>
      <label class="block text-sm font-semibold text-slate-300 mb-2">Nome Completo</label>
      <input 
        name="nome"
        [(ngModel)]="nuovoUtente.nome"
        required
        type="text" 
        placeholder="Esempio: Mario Rossi"
        class="w-full p-4 rounded-2xl border border-slate-700 bg-white text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all font-medium"
      />
    </div>

    <div>
      <label class="block text-sm font-semibold text-slate-300 mb-2">Indirizzo Email</label>
      <input 
        name="email"
        [(ngModel)]="nuovoUtente.email"
        required
        email
        type="email" 
        placeholder="mario@esempio.it"
        class="w-full p-4 rounded-2xl border border-slate-700 bg-white text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all font-medium"
      />
    </div>

    <button 
      [disabled]="!userForm.form.valid"
      type="submit"
      class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 disabled:bg-slate-800 disabled:text-slate-500 transition-all duration-200 transform hover:scale-[1.01] active:scale-95 shadow-lg shadow-blue-500/10"
    >
      Registra Utente
    </button>
  </form>
</div>
