<div class="min-h-screen bg-gray-100 p-6">
  <div class="max-w-6xl mx-auto">
    
    <div class="flex justify-between items-center mb-10">
      <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">📚 LibraryManager <span class="text-blue-600">Pro</span></h1>
      <button class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition shadow-lg">
        + Aggiungi Libro
      </button>
    </div>

    <div class="relative mb-8">
      <input 
        [(ngModel)]="testoCercato"
        type="text" 
        placeholder="Cerca per titolo o autore..." 
        class="w-full p-4 pl-12 rounded-2xl border-none shadow-md focus:ring-2 focus:ring-blue-500 outline-none text-gray-600"
      />
      <span class="absolute left-4 top-4 opacity-30">🔍</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let libro of libriFiltrati" class="bg-white rounded-3xl p-6 shadow-sm hover:shadow-2xl transition-all duration-300 border border-transparent hover:border-blue-100 group">
        <div class="flex justify-between items-start mb-4">
          <div class="p-3 bg-blue-50 rounded-2xl text-2xl group-hover:bg-blue-600 transition-colors duration-300">📖</div>
          <span [class]="libro.is_disponibile ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'" class="text-xs font-bold px-3 py-1 rounded-full uppercase">
            {{ libro.is_disponibile ? 'Disponibile' : 'In Prestito' }}
          </span>
        </div>
        
        <h3 class="text-xl font-bold text-gray-800 mb-1">{{ libro.titolo }}</h3>
        <p class="text-gray-500 font-medium mb-4">{{ libro.autore }}</p>
        
        <div class="border-t pt-4 mt-4 flex justify-between items-center text-sm">
          <span class="text-gray-400">Genere: <b class="text-gray-600">{{ libro.genere }}</b></span>
          <button class="text-blue-600 font-bold hover:underline">Dettagli →</button>
        </div>
      </div>
    </div>

  </div>
</div>
