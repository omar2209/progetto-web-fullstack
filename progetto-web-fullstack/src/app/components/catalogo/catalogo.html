<div class="space-y-6">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <h2 class="text-2xl font-bold text-slate-100 flex items-center gap-2">
      <span>📚</span> Catalogo Libri Real-Time
    </h2>
    <input 
      [(ngModel)]="testoCercato"
      type="text" 
      placeholder="🔍 Cerca per titolo, autore o genere..." 
      class="w-full sm:w-80 p-3 rounded-xl border border-slate-700 bg-white text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all font-medium"
    />
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let libro of libriFiltrati" class="bg-slate-900/60 p-5 rounded-2xl border border-slate-800 shadow-xl hover:border-slate-700 transition-all duration-300 hover:scale-[1.02] group flex gap-4 items-center">
      
      <div class="w-20 h-28 flex-shrink-0 rounded-xl overflow-hidden shadow-md bg-slate-950">
        <img [src]="libro.copertina" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" alt="Cover">
      </div>

      <div class="flex-1 min-w-0 space-y-1.5">
        <div class="flex justify-between items-center gap-2">
          <span class="px-2 py-0.5 bg-slate-800 text-slate-400 rounded text-[10px] font-bold uppercase tracking-wider truncate">
            {{ libro.genere }}
          </span>
          <span [class]="libro.is_disponibile ? 'text-emerald-400' : 'text-rose-400'" class="text-[10px] font-bold shrink-0">
            {{ libro.is_disponibile ? '● Disponibile' : '● Occupato' }}
          </span>
        </div>
        <h3 class="text-base font-bold text-slate-100 truncate group-hover:text-blue-400 transition-colors">{{ libro.titolo }}</h3>
        <p class="text-slate-400 text-xs italic truncate">{{ libro.autore }}</p>
      </div>

    </div>
  </div>
</div>
