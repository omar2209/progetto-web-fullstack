<div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl border border-gray-100 mt-10">
  <div class="text-center mb-8">
    <div class="inline-block p-4 bg-blue-50 rounded-full mb-4">
      <span class="text-3xl">👤</span>
    </div>
    <h2 class="text-2xl font-bold text-gray-800">Nuovo Utente</h2>
    <p class="text-gray-500 text-sm">Registra un nuovo membro della biblioteca</p>
  </div>

  <form (ngSubmit)="salvaUtente()" #userForm="ngForm" class="space-y-6">
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">Nome Completo</label>
      <input 
        name="nome"
        [(ngModel)]="nuovoUtente.nome"
        required
        type="text" 
        placeholder="Esempio: Mario Rossi"
        class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
      />
    </div>

    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">Indirizzo Email</label>
      <input 
        name="email"
        [(ngModel)]="nuovoUtente.email"
        required
        email
        type="email" 
        placeholder="mario@esempio.it"
        class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
      />
    </div>

    <button 
      [disabled]="!userForm.form.valid"
      type="submit"
      class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 disabled:bg-gray-300 shadow-lg shadow-blue-200 transition-all active:scale-95"
    >
      Registra Utente
    </button>
  </form>
</div>
